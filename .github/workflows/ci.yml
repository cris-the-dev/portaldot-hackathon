name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Lint · typecheck · test (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # anvil is used by integration tests (e.g. `portalkit doctor`)
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test build

  contracts:
    name: Forge fmt · build · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # OZ's own nested test submodules aren't needed

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - run: forge fmt --check

      - run: forge build --sizes

      - run: forge test -vvv
