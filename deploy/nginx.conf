# /etc/nginx/sites-available/portalkit.cristhedev.com → symlink into sites-enabled, then:
#   certbot --nginx -d portalkit.cristhedev.com
server {
    listen 80;
    server_name portalkit.cristhedev.com;
    location /vault {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
