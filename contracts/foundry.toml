[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read", path = "../config" },
    { access = "read-write", path = "../config/deployments" },
]

[fuzz]
runs = 512

[profile.ci.fuzz]
runs = 4096

[fmt]
line_length = 120

# RPC endpoints mirror config/networks.json (single source of truth).
# Portaldot V3 testnet EVM endpoint per the organizers' announcement (2026-10-20).
[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
portaldot_v3 = "https://test-evm-rpc-v3.portaldot.dev"
