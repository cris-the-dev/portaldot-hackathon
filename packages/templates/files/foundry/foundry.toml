[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fmt]
line_length = 120

# Mirrors ../networks.json.
[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
portaldot_v3 = "https://test-evm-rpc-v3.portaldot.dev"
