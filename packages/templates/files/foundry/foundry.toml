[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[fmt]
line_length = 120

# Mirrors ../networks.json. Portaldot V3's RPC comes from env until V3 is public.
[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
portaldot_v3 = "${PORTALDOT_V3_RPC_URL}"
